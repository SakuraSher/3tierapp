name: Build and Push to Docker Hub

on:
  workflow_dispatch:

jobs:
  build-push:
    strategy:
      matrix:
        services:
          - name: backend
            path: 3-tier-app/src/backend
            dockerhub_repo: sakurasherlocked/backend
          - name: frontend
            path: 3-tier-app/src/frontend
            dockerhub_repo: sakurasherlocked/frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.services.path }}
          push: true
          platforms: linux/arm64
          tags: |
            ${{ matrix.services.dockerhub_repo }}:${{ github.sha }}
            ${{ matrix.services.dockerhub_repo }}:latest